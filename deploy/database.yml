services:
  postgres:
    image: postgres:16-alpine
    container_name: masterland-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    env_file: /opt/masterland/env/database.env
    volumes: ["masterland-postgres:/var/lib/postgresql/data"]
    # Database is reachable only on the private Masterland Docker network.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB"]
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterland_admin -d masterland_prod"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [masterland]
volumes:
  masterland-postgres:
    name: masterland-postgres
networks:
  masterland:
    external: true
    name: masterland
