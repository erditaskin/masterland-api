log_format masterland_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
server {
    listen 80;
    listen [::]:80;
    server_name api.masterland.app;
    access_log /var/log/nginx/masterland-api.access.log masterland_safe;
    error_log /var/log/nginx/masterland-api.error.log warn;
    server_tokens off;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name masterland.app www.masterland.app;
    root /opt/masterland/web/current/public;
    index index.html;
    access_log /var/log/nginx/masterland-web.access.log masterland_safe;
    error_log /var/log/nginx/masterland-web.error.log warn;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /opt/masterland/web/current/nginx-security.conf;
    location / { try_files $uri $uri/ =404; }
    location = /app-ads.txt { default_type text/plain; try_files $uri =404; }
    location ~ /\. { deny all; }
}
