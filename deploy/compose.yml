services:
  api:
    image: ${MASTERLAND_API_IMAGE:?Exact release image required}
    container_name: masterland-api
    restart: unless-stopped
    init: true
    env_file: /opt/masterland/env/api.env
    environment:
      RELEASE_ID: ${MASTERLAND_RELEASE:?Exact release required}
      HOST: 0.0.0.0
      PORT: "4200"
    ports: ["127.0.0.1:4200:4200"]
    volumes: ["/opt/masterland/secrets:/run/masterland-secrets:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 160m
    cpus: 0.75
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [masterland]
networks:
  masterland:
    external: true
    name: masterland
